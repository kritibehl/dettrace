receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 200ms

exporters:
  file/dettrace:
    path: /data/*.otlp.jsonl
    format: json
    append: true
    flush_interval: 200ms
    create_directory: true
    group_by:
      enabled: true
      resource_attribute: dettrace.mode
      max_open_files: 4

service:
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - file/dettrace
